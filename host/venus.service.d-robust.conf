# /etc/systemd/system/venus.service.d/robust.conf
# Keep the Venus OS container running: restart it whenever it stops, and clear a stale machine
# registration first (2026-10-07: "Failed to register machine: Machine 'venus' already exists" left
# Venus down after a stop that had to be SIGKILLed).
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=15
ExecStartPre=-/bin/sh -c "machinectl show venus >/dev/null 2>&1 && { machinectl terminate venus; sleep 3; machinectl kill --signal=KILL venus 2>/dev/null; sleep 1; }; true"
