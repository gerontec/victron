# Venus OS settings (com.victronenergy.settings) written by host/venus-settings.sh apply.
# One line per setting: <path> <value>; value as for the Venus dbus tool: %<number> for numbers, plain text for strings.
# Update after commissioning with: venus-settings.sh save [extra path ...]   (rewrites the values from the running Venus)
# The CAN profile (/Settings/Canbus/<if>/Profile) is not listed here: venus-can-profile sets it together with the host bitrate.

# battery monitor and BMS for DVCC: Speicher B (EBox, dbus-ebox-battery, instance 513), not Speicher A (can-bus-bms, 512)
/Settings/SystemSetup/BatteryService com.victronenergy.battery/513
/Settings/SystemSetup/BmsInstance %513
